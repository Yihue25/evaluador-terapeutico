<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asistente Terapéutico - Selección de Paquetes</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <meta name="theme-color" content="#0f766e">

    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #0d9488;
            --bg: #f8fafc;
            --surface: rgba(255, 255, 255, 0.92);
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --input-bg: #ffffff;
            --card-pkg-bg: rgba(241, 245, 249, 0.8);
            --accent: #fef2f2;
            --accent-border: #fca5a5;
            --gold: #d97706;
            --gold-bg: rgba(255, 251, 235, 0.9);
            --gold-border: #fef3c7;
            --session-bg: rgba(248, 250, 252, 0.85);
            --block-bg: rgba(255, 255, 255, 0.7);
        }

        body.dark-mode {
            --primary: #14b8a6;
            --primary-dark: #0d9488;
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.92);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
            --card-pkg-bg: rgba(51, 65, 85, 0.8);
            --accent: #450a0a;
            --accent-border: #991b1b;
            --gold: #fbbf24;
            --gold-bg: rgba(45, 35, 5, 0.9);
            --gold-border: #78350f;
            --session-bg: rgba(17, 24, 39, 0.85);
            --block-bg: rgba(30, 41, 59, 0.7);
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            max-width: 380px;
            height: 80vw;
            max-height: 380px;
            background-image: url('icon-192.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }

        body.dark-mode .watermark { opacity: 0.08; }

        header {
            background: linear-gradient(135deg, #0f766e, #0d9488);
            color: white;
            padding: 16px;
            text-align: center;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: relative;
            z-index: 2;
        }

        header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; }
        header p { margin: 4px 0 0 0; font-size: 0.8rem; opacity: 0.9; }

        .theme-toggle-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        main { 
            padding: 16px; 
            max-width: 650px; 
            margin: 0 auto; 
            width: 100%; 
            flex: 1; 
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        label {
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--primary);
            display: block;
            margin-bottom: 6px;
        }

        textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 12px;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text);
        }

        .package-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .package-card {
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            background: var(--card-pkg-bg);
        }

        .package-card input[type="radio"] { display: none; }
        .package-card.selected-basic { border-color: var(--primary); background-color: var(--surface); }
        .package-card.selected-premium { border-color: var(--gold); background-color: var(--gold-bg); }

        .package-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; }
        .package-desc { font-size: 0.75rem; color: var(--text-muted); }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .checkbox-item { font-size: 0.85rem; display: flex; align-items: center; gap: 6px; color: var(--text); }

        button.btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        #result-card { display: none; }

        .pkg-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .pkg-badge.basic { background: #e0f2fe; color: #0369a1; }
        body.dark-mode .pkg-badge.basic { background: #0369a1; color: #e0f2fe; }
        .pkg-badge.premium { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold-border); }

        .session-item {
            background: var(--session-bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 0.88rem;
        }

        .session-item.premium-session {
            border-left-color: var(--gold);
            background: var(--gold-bg);
        }

        .session-number {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .session-number.premium-title { color: var(--gold); }

        .section-block {
            margin-top: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            background-color: var(--block-bg);
            border: 1px dashed var(--border);
        }

        .section-title {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .exercise-item-interactive {
            margin-top: 6px;
            padding: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .exercise-item-interactive:hover { border-color: var(--primary); }

        .exercise-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-2d-badge {
            font-size: 0.72rem;
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .canvas-2d-container {
            display: none;
            margin-top: 10px;
            text-align: center;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
        }

        canvas.model-2d-canvas {
            background-color: #f1f5f9;
            border-radius: 8px;
            border: 1px solid var(--border);
            max-width: 100%;
        }

        body.dark-mode canvas.model-2d-canvas { background-color: #1e293b; }

        .alert-box {
            background-color: var(--accent);
            border: 1px solid var(--accent-border);
            color: #f87171;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .alert-box ul { margin: 4px 0 0 0; padding-left: 18px; }
    </style>
</head>
<body>

    <div class="watermark"></div>

    <header>
        <button class="theme-toggle-btn" id="themeBtn" onclick="toggleDarkMode()">🌙 Oscuro</button>
        <h1>Evaluador Terapéutico</h1>
        <p>Acompañamiento Domiciliario Asistido</p>
    </header>

    <main>
        <div class="card">
            <label for="problemInput">Descripción de la Dolencia / Diagnóstico:</label>
            <textarea id="problemInput" rows="3" placeholder="Ej: Esclerosis múltiple, fractura de tobillo, dolor lumbar, esguince de rodilla, parálisis facial, muñeca..."></textarea>

            <label for="severitySelect">Nivel de Severidad / Evolución:</label>
            <select id="severitySelect">
                <option value="leve">Leve / Reciente (< 2 semanas)</option>
                <option value="moderado" selected>Moderado / Subagudo (2 - 6 semanas)</option>
                <option value="severo">Severo / Crónico (> 6 semanas)</option>
            </select>

            <label>Seleccione el Paquete de Tratamiento:</label>
            <div class="package-selector">
                <div class="package-card selected-basic" id="cardBasic" onclick="selectPackage('basico')">
                    <input type="radio" name="pkgOption" id="pkgBasic" value="basico" checked>
                    <div class="package-title" style="color: var(--primary);">BÁSICO</div>
                    <div class="package-desc">Únicamente compresas físicas y ejercicios de movilidad.</div>
                </div>
                <div class="package-card" id="cardPremium" onclick="selectPackage('premium')">
                    <input type="radio" name="pkgOption" id="pkgPremium" value="premium">
                    <div class="package-title" style="color: var(--gold);">PREMIUM ⭐</div>
                    <div class="package-desc">Compresas + TENS/EMS + Terapia Manual Avanzada.</div>
                </div>
            </div>

            <label>Condiciones Físicas del Paciente:</label>
            <div class="checkbox-group">
                <label class="checkbox-item"><input type="checkbox" id="chkPacemaker"> Marcapasos/Eléctrico</label>
                <label class="checkbox-item"><input type="checkbox" id="chkMetal"> Implante Metal</label>
                <label class="checkbox-item"><input type="checkbox" id="chkDiu"> DIU / Anticonceptivo</label>
                <label class="checkbox-item"><input type="checkbox" id="chkElder"> Adulto Mayor / Frágil</label>
            </div>

            <button class="btn-primary" onclick="evaluarCaso()">Calcular Plan de Sesiones</button>
        </div>

        <div class="card" id="result-card">
            <div id="pkgBadgeContainer"></div>
            
            <div style="margin-bottom: 12px;">
                <span style="font-weight: bold; font-size: 1.1rem;" id="outTotalSessions"></span>
                <div style="font-size: 0.8rem; color: var(--text-muted);" id="outFrequency"></div>
            </div>

            <div style="font-weight: bold; color: var(--text); margin-bottom: 8px; font-size: 0.9rem;">
                DESGLOSE Y PROTOCOLO SESIÓN POR SESIÓN:
            </div>

            <div id="outSessionsList"></div>

            <div id="outAlerts"></div>
        </div>
    </main>

    <script>
        const activeAnimations = {};

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('themeBtn');
            if (isDark) {
                btn.innerHTML = '☀️ Claro';
                localStorage.setItem('theme', 'dark');
            } else {
                btn.innerHTML = '🌙 Oscuro';
                localStorage.setItem('theme', 'light');
            }
        }

        (function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeBtn').innerHTML = '☀️ Claro';
            }
        })();

        function selectPackage(type) {
            const cardB = document.getElementById('cardBasic');
            const cardP = document.getElementById('cardPremium');
            const radioB = document.getElementById('pkgBasic');
            const radioP = document.getElementById('pkgPremium');
            
            if (type === 'basico') {
                cardB.className = 'package-card selected-basic';
                cardP.className = 'package-card';
                radioB.checked = true;
                radioP.checked = false;
            } else {
                cardB.className = 'package-card';
                cardP.className = 'package-card selected-premium';
                radioB.checked = false;
                radioP.checked = true;
            }
        }

        // =========================================================================
        // 🎨 MOTOR DE ANIMACIONES 2D
        // =========================================================================
        function toggle2DModel(canvasId, modelType) {
            const container = document.getElementById(`container-${canvasId}`);
            const badge = document.getElementById(`badge-${canvasId}`);

            if (container.style.display === 'block') {
                container.style.display = 'none';
                badge.innerText = '▶ Ver Animación 2D';
                if (activeAnimations[canvasId]) {
                    cancelAnimationFrame(activeAnimations[canvasId]);
                    delete activeAnimations[canvasId];
                }
            } else {
                container.style.display = 'block';
                badge.innerText = '▼ Ocultar 2D';
                const canvas = document.getElementById(canvasId);
                const ctx = canvas.getContext('2d');
                let step = 0;

                function animate() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    if (modelType === 'tobillo_flex') drawAnkleFlexionAdvanced(ctx, step);
                    else if (modelType === 'tobillo_ball') drawAnkleBallAdvanced(ctx, step);
                    else if (modelType === 'rodilla_flex') drawKneeFlexionAdvanced(ctx, step);
                    else if (modelType === 'rodilla_squat') drawKneeSquatAdvanced(ctx, step);
                    else if (modelType === 'lumbar_stretch') drawLumbarCatCowAdvanced(ctx, step);
                    else if (modelType === 'lumbar_bridge') drawLumbarBridgeAdvanced(ctx, step);
                    else if (modelType === 'muneca_flex') drawWristFlexionAdvanced(ctx, step);
                    else if (modelType === 'muneca_grip') drawWristGripAdvanced(ctx, step);
                    else if (modelType === 'neuro_march') drawNeurologicalMarchAdvanced(ctx, step);
                    else if (modelType === 'facial_gestures') drawFacialGesturesAdvanced(ctx, step);
                    else drawAnkleFlexionAdvanced(ctx, step);

                    step += 0.035;
                    activeAnimations[canvasId] = requestAnimationFrame(animate);
                }
                animate();
            }
        }

        function drawJoint(ctx, x, y, radius = 5) {
            const isDark = document.body.classList.contains('dark-mode');
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = isDark ? '#2dd4bf' : '#0f766e';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function drawSegment(ctx, x1, y1, x2, y2, color, width = 6) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        function drawAnkleFlexionAdvanced(ctx, step) {
            const angle = Math.sin(step) * 0.35;
            const isDark = document.body.classList.contains('dark-mode');
            const bodyColor = isDark ? '#14b8a6' : '#0f766e';

            drawSegment(ctx, 80, 25, 150, 90, bodyColor, 8);
            drawJoint(ctx, 150, 90, 6);

            ctx.save();
            ctx.translate(150, 90);
            ctx.rotate(angle);
            drawSegment(ctx, 0, 0, 45, 12, '#d97706', 7);
            drawSegment(ctx, -10, 8, 45, 12, '#d97706', 5);

            ctx.beginPath();
            ctx.moveTo(45, 12);
            ctx.lineTo(-60, -40);
            ctx.strokeStyle = '#ef4444';
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }

        function drawAnkleBallAdvanced(ctx, step) {
            const roll = Math.sin(step) * 35;
            const isDark = document.body.classList.contains('dark-mode');
            const bodyColor = isDark ? '#14b8a6' : '#0f766e';

            const ballX = 150 + roll;
            ctx.beginPath();
            ctx.arc(ballX, 105, 16, 0, Math.PI * 2);
            ctx.fillStyle = '#d97706';
            ctx.fill();
            ctx.strokeStyle = '#b45309';
            ctx.lineWidth = 2;
            ctx.stroke();

            drawSegment(ctx, 80, 20, 115 + roll * 0.4, 70, bodyColor, 7);
            drawSegment(ctx, 115 + roll * 0.4, 70, ballX, 90, '#d97706', 6);
            drawJoint(ctx, 115 + roll * 0.4, 70, 5);
            drawJoint(ctx, ballX, 90, 5);

            drawSegment(ctx, 30, 122, 270, 122, isDark ? '#475569' : '#cbd5e1', 2);
        }

        function drawKneeFlexionAdvanced(ctx, step) {
            const angle = Math.sin(step) * 0.5 + 0.2;
            const isDark = document.body.classList.contains('dark-mode');
            const bodyColor = isDark ? '#14b8a6' : '#0f766e';

            drawSegment(ctx, 70, 40, 135, 70, bodyColor, 8);
            drawJoint(ctx, 135, 70, 7);

            ctx.save();
            ctx.translate(135, 70);
            ctx.rotate(angle);
            drawSegment(ctx, 0, 0, 55, 45, '#d97706', 7);
            drawJoint(ctx, 55, 45, 5);
            ctx.restore();
        }

        function drawKneeSquatAdvanced(ctx, step) {
            const squat = (Math.sin(step) + 1) * 12;
            const isDark = document.body.classList.contains('dark-mode');
            const bodyColor = isDark ? '#14b8a6' : '#0f766e';

            drawSegment(ctx, 140, 25 + squat, 140, 60 + squat, bodyColor, 8);
            ctx.beginPath(); ctx.arc(140, 15 + squat, 8, 0, Math.PI * 2); ctx.fillStyle = bodyColor; ctx.fill();

            drawJoint(ctx, 140, 60 + squat, 6);

            drawSegment(ctx, 140, 60 + squat, 115, 80 + squat * 0.5, '#d97706', 7);
            drawSegment(ctx, 115, 80 + squat * 0.5, 120, 115, bodyColor, 6);

            drawSegment(ctx, 140, 60 + squat, 165, 80 + squat * 0.5, '#d97706', 7);
            drawSegment(ctx, 165, 80 + squat * 0.5, 160, 115, bodyColor, 6);

            drawSegment(ctx, 80, 116, 200, 116, isDark ? '#475569' : '#cbd5e1', 2);
        }

        function drawLumbarCatCowAdvanced(ctx, step) {
            const curve = Math.sin(step) * 18;
            const isDark = document.body.classList.contains('dark-mode');
            const bodyColor = isDark ? '#14b8a6' : '#0f766e';

            ctx.beginPath(); ctx.arc(70, 60 - curve * 0.3, 9, 0, Math.PI * 2); ctx.fillStyle = bodyColor; ctx.fill();

            ctx.beginPath();
            ctx.moveTo(80, 60);
            ctx.quadraticCurveTo(140, 60 + curve, 200, 60);
            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 7;
            ctx.stroke();

            drawSegment(ctx, 85, 60, 85, 105, bodyColor, 5);
            drawSegment(ctx, 195, 60, 195, 105, bodyColor, 5);
            drawJoint(ctx, 85, 60, 5);
            drawJoint(ctx, 195, 60, 5);

            drawSegment(ctx, 50, 106, 230, 106, isDark ? '#475569' : '#cbd5e1', 2);
        }

        function drawLumbarBridgeAdvanced(ctx, step) {
            const lift = (Math.sin(step) + 1) * 15;
            const isDark = document.body.classList.contains('dark-mode');
            const bodyColor = isDark ? '#14b8a6' : '#0f766e';

            ctx.beginPath(); ctx.arc(70, 95, 8, 0, Math.PI * 2); ctx.fillStyle = bodyColor; ctx.fill();

            drawSegment(ctx, 75, 95, 135, 95 - lift, '#d97706', 8);
            drawJoint(ctx, 135, 95 - lift, 6);

            drawSegment(ctx, 135, 95 - lift, 185, 95, bodyColor, 7);
            drawSegment(ctx, 185, 95, 185, 115, bodyColor, 6);
            drawJoint(ctx, 185, 95, 5);

            drawSegment(ctx, 50, 116, 220, 116, isDark ? '#475569' : '#cbd5e1', 2);
        }

        function drawWristFlexionAdvanced(ctx, step) {
            const angle = Math.sin(step) * 0.4;
            const isDark = document.body.classList.contains('dark-mode');
            const bodyColor = isDark ? '#14b8a6' : '#0f766e';

            drawSegment(ctx, 50, 65, 150, 65, bodyColor, 9);
            drawJoint(ctx, 150, 65, 7);

            ctx.save();
            ctx.translate(150, 65);
            ctx.rotate(angle);
            drawSegment(ctx, 0, 0, 45, 0, '#d97706', 7);
            drawSegment(ctx, 45, 0, 60, 5, '#d97706', 4);
            ctx.restore();
        }

        function drawWristGripAdvanced(ctx, step) {
            const squeeze = Math.sin(step) * 4;
            const isDark = document.body.classList.contains('dark-mode');

            ctx.beginPath();
            ctx.arc(170, 65, 15 - squeeze, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();

            drawSegment(ctx, 60, 65, 150, 65, isDark ? '#14b8a6' : '#0f766e', 8);
            drawJoint(ctx, 150, 65, 6);

            ctx.beginPath();
            ctx.arc(165, 65, 18 - squeeze, -Math.PI * 0.7, Math.PI * 0.7);
            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 6;
            ctx.stroke();
        }

        function drawNeurologicalMarchAdvanced(ctx, step) {
            const armSway = Math.sin(step) * 0.4;
            const legLift = Math.cos(step) * 0.3;
            const isDark = document.body.classList.contains('dark-mode');
            const bodyColor = isDark ? '#14b8a6' : '#0f766e';

            ctx.beginPath(); ctx.arc(140, 25, 9, 0, Math.PI * 2); ctx.fillStyle = bodyColor; ctx.fill();
            drawSegment(ctx, 140, 34, 140, 75, bodyColor, 7);

            drawSegment(ctx, 140, 42, 110, 60 + armSway * 15, '#d97706', 5);
            drawSegment(ctx, 140, 42, 170, 60 - armSway * 15, '#d97706', 5);

            drawSegment(ctx, 140, 75, 125, 100 + legLift * 10, bodyColor, 6);
            drawSegment(ctx, 140, 75, 155, 100 - legLift * 10, bodyColor, 6);

            drawJoint(ctx, 140, 75, 5);
        }

        function drawFacialGesturesAdvanced(ctx, step) {
            const smile = Math.sin(step) * 8;
            const eyeBlink = Math.abs(Math.sin(step * 0.8)) * 3;
            const isDark = document.body.classList.contains('dark-mode');

            ctx.beginPath(); ctx.arc(140, 60, 42, 0, Math.PI * 2);
            ctx.strokeStyle = isDark ? '#14b8a6' : '#0f766e'; ctx.lineWidth = 4; ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(122, 50, 5, 4 - eyeBlink, 0, 0, Math.PI * 2);
            ctx.ellipse(158, 50, 5, 4 - eyeBlink, 0, 0, Math.PI * 2);
            ctx.fillStyle = isDark ? '#2dd4bf' : '#0f766e'; ctx.fill();

            drawSegment(ctx, 115, 40 - smile * 0.3, 130, 42, '#d97706', 3);
            drawSegment(ctx, 150, 42, 165, 40 - smile * 0.3, '#d97706', 3);

            ctx.beginPath();
            ctx.moveTo(120, 75 - smile * 0.2);
            ctx.quadraticCurveTo(140, 75 + smile, 160, 75 - smile * 0.2);
            ctx.strokeStyle = '#d97706'; ctx.lineWidth = 4; ctx.stroke();
        }

        // =========================================================================

        // =========================================================================
        // EVALUACIÓN Y GENERACIÓN DINÁMICA CON VARIACIÓN
        // =========================================================================
        function evaluarCaso() {
            const isPremium = document.getElementById('pkgPremium').checked;
            const currentPkg = isPremium ? 'premium' : 'basico';

            const rawText = document.getElementById('problemInput').value.toLowerCase();
            const severity = document.getElementById('severitySelect').value;
            
            const hasPacemaker = document.getElementById('chkPacemaker').checked;
            const hasMetal = document.getElementById('chkMetal').checked;
            const hasDiu = document.getElementById('chkDiu').checked;
            const isElder = document.getElementById('chkElder').checked;

            if (!rawText.trim()) {
                alert("Por favor ingrese la descripción del problema.");
                return;
            }

            const esEsclerosis = rawText.includes("esclerosis") || rawText.includes("em") || rawText.includes("ela");
            const esFractura = rawText.includes("fractura") || rawText.includes("fisura") || rawText.includes("roto") || rawText.includes("hueso");
            const esRostro = rawText.includes("cara") || rawText.includes("paralisis facial") || rawText.includes("rostro");
            
            const esTobilloPie = rawText.includes("tobillo") || rawText.includes("pie") || rawText.includes("peroné") || rawText.includes("perone") || rawText.includes("tibial") || rawText.includes("maleolo");
            const esRodillaPierna = rawText.includes("rodilla") || rawText.includes("fémur") || rawText.includes("femur") || rawText.includes("tibia");
            const esManoMuneca = rawText.includes("radio") || rawText.includes("antebrazo") || rawText.includes("muñeca") || rawText.includes("mano") || rawText.includes("dedo");
            const esEspaldaLumbar = rawText.includes("lumbar") || rawText.includes("espalda") || rawText.includes("ciatica") || rawText.includes("cuello") || rawText.includes("cervical");

            let keyZona = "tobillo";
            let zonaNombre = "Zona Afectada / Musculatura Global";

            if (esEsclerosis) { keyZona = "neuro"; zonaNombre = "Extremidades y Control Postural (Neurológico)"; }
            else if (esRostro) { keyZona = "facial"; zonaNombre = "Musculatura Facial"; }
            else if (esTobilloPie) { keyZona = "tobillo"; zonaNombre = "Articulación del Tobillo y Pie"; }
            else if (esRodillaPierna) { keyZona = "rodilla"; zonaNombre = "Articulación de la Rodilla y Pierna"; }
            else if (esManoMuneca) { keyZona = "muneca"; zonaNombre = "Antebrazo, Muñeca y Mano"; }
            else if (esEspaldaLumbar) { keyZona = "lumbar"; zonaNombre = "Zona Lumbar y Espalda"; }

            let freqTensAgudo = "80 - 120 Hz (TENS Convencional)";
            let freqTensCronico = "2 - 10 Hz (TENS Acupuntura)";
            let freqEms = "35 - 50 Hz (Potenciación Motora)";

            if (esEsclerosis) {
                freqTensAgudo = "50 - 80 Hz (Modulación de Espasticidad)";
                freqTensCronico = "20 - 40 Hz (Reeducación Neuromuscular)";
                freqEms = "20 - 30 Hz (Activación motora de baja fatiga)";
            }

            let tempCompresa = "";
            if (esEsclerosis) tempCompresa = "Crioterapia / Compresa Fría templada (12°C - 18°C).";
            else if (severity === 'leve') tempCompresa = "Crioterapia (Compresa Fría / Gelpack a 0°C - 4°C).";
            else if (severity === 'moderado') tempCompresa = "Termoterapia (Compresa Húmedo-Caliente a 40°C - 45°C).";
            else tempCompresa = "Termoterapia Profunda (Compresa Caliente a 42°C - 48°C).";

            let numSesiones = 6;
            if (severity === 'leve') numSesiones = 5;
            if (severity === 'moderado') numSesiones = 8;
            if (severity === 'severo') numSesiones = 12;

            if (esEsclerosis) numSesiones += 2;
            if (currentPkg === 'premium') numSesiones += 2;

            let alertas = [];
            if (esEsclerosis) {
                alertas.push("🧠 PRECAUCIÓN ESCLEROSIS: Evitar fuentes de calor intenso.");
                alertas.push("⚠️ GESTIÓN DE FATIGA: Detener los ejercicios ante fatiga.");
            }
            if (esFractura) {
                alertas.push("🦴 PRECAUCIÓN FRACTURA: No realizar apoyos de peso sin autorización médica.");
            }
            if (currentPkg === 'premium' && hasPacemaker) alertas.push("⛔ CONTRAINDICACIÓN CRÍTICA: Se omite la electroterapia por marcapasos.");
            if (hasMetal) alertas.push("⚠️ PRECAUCIÓN METAL: Evitar calor profundo o electrodos directos sobre placas.");
            if (hasDiu) alertas.push("ℹ️ NOTA DIU: Evitar aplicación directa en vientre bajo.");
            if (isElder) alertas.push("👵 ADULTO MAYOR: Moderar temperatura e intensidad.");

            let listaSesionesHTML = "";

            for (let i = 1; i <= numSesiones; i++) {
                let fase = "";
                let agentesInfo = "";
                let procedimiento = [];
                let exList = [];

                const limiteFase1 = Math.ceil(numSesiones * 0.3);
                const limiteFase2 = Math.ceil(numSesiones * 0.7);

                if (i <= limiteFase1) {
                    fase = "Fase Inicial / Control Inflamatorio y Movilidad Pasiva";
                    exList = exercisePhasesDB[keyZona].fase1;

                    if (currentPkg === 'basico') {
                        agentesInfo = `• <strong>Medio Físico (Básico):</strong> ${tempCompresa} (15 min).`;
                        procedimiento.push("• Aplicación del medio físico local.");
                        procedimiento.push("• Movilización asistida ligera.");
                    } else {
                        let electroText = hasPacemaker ? "Omitido por marcapasos." : `TENS Modulado a <strong>${freqTensAgudo}</strong> (20 min).`;
                        agentesInfo = `• <strong>Medio Físico:</strong> ${tempCompresa} (15 min).<br>• <strong>[PREMIUM] Electroterapia:</strong> ${electroText}`;
                        procedimiento.push("• Aplicación combinada de electroterapia y compresa.");
                        procedimiento.push("• <strong>[PREMIUM] Terapia Manual:</strong> Liberación miofascial ligera.");
                    }
                } else if (i <= limiteFase2) {
                    fase = "Fase Intermedia / Movilidad Activa y Resistencia";
                    exList = exercisePhasesDB[keyZona].fase2;

                    if (currentPkg === 'basico') {
                        agentesInfo = `• <strong>Medio Físico (Básico):</strong> Compresa Húmedo-Caliente (15 min).`;
                        procedimiento.push("• Preparación muscular mediante calor/frío.");
                        procedimiento.push("• Guía de ejercicios de flexibilidad.");
                    } else {
                        let electroText = hasPacemaker ? "Omitido por marcapasos." : `TENS / EMS a <strong>${freqTensCronico}</strong> (20 min).`;
                        agentesInfo = `• <strong>Medio Físico:</strong> Compresa Húmedo-Caliente (15 min).<br>• <strong>[PREMIUM] Electroterapia:</strong> ${electroText}`;
                        procedimiento.push("• Aplicación de electroterapia y compresa.");
                        procedimiento.push("• <strong>[PREMIUM] Terapia Manual Avanzada:</strong> Movilización articular.");
                    }
                } else {
                    fase = "Fase Avanzada / Fortalecimiento y Carga Funcional";
                    exList = exercisePhasesDB[keyZona].fase3;

                    if (currentPkg === 'basico') {
                        agentesInfo = `• <strong>Medio Físico (Básico):</strong> Crioterapia / Compresa Fría (10 min).`;
                        procedimiento.push("• Plan de fuerza y equilibrio autónomo.");
                        procedimiento.push("• Cierre con crioterapia.");
                    } else {
                        let electroText = hasPacemaker ? "Omitido por marcapasos." : `EMS Potenciación a <strong>${freqEms}</strong> (15 min).`;
                        agentesInfo = `• <strong>Medio Físico:</strong> Crioterapia (10 min).<br>• <strong>[PREMIUM] Electroterapia:</strong> ${electroText}`;
                        procedimiento.push("• Electroestimulación para potenciación motora.");
                        procedimiento.push("• <strong>[PREMIUM] Reeducación Funcional:</strong> Análisis del apoyo.");
                    }
                }

                // RENDERING DE EJERCICIOS VARIADOS
                let ejerciciosHTML = exList.map((ex, idx) => {
                    let canvasId = `cv_s${i}_ex${idx}`;
                    return `
                        <div class="exercise-item-interactive" onclick="toggle2DModel('${canvasId}', '${ex.type}')">
                            <div class="exercise-header-row">
                                <span>${ex.title}</span>
                                <span class="toggle-2d-badge" id="badge-${canvasId}">▶ Ver Animación 2D</span>
                            </div>
                            <div class="canvas-2d-container" id="container-${canvasId}">
                                <canvas id="${canvasId}" class="model-2d-canvas" width="280" height="130"></canvas>
                            </div>
                        </div>
                    `;
                }).join('');

                const isPremItem = currentPkg === 'premium' ? 'premium-session' : '';
                const isPremTitle = currentPkg === 'premium' ? 'premium-title' : '';

                listaSesionesHTML += `
                    <div class="session-item ${isPremItem}">
                        <div class="session-number ${isPremTitle}">Sesión ${i} - <span style="font-weight: normal; color: var(--text-muted);">${fase}</span></div>
                        
                        <div class="section-block">
                            <div class="section-title">📍 Zona de Aplicación:</div>
                            <div style="color: var(--text);">${zonaNombre}</div>
                        </div>

                        <div class="section-block">
                            <div class="section-title">⚡ Agentes Físicos y Aparatología:</div>
                            <div style="color: var(--text);">${agentesInfo}</div>
                        </div>

                        <div class="section-block">
                            <div class="section-title">📋 Procedimiento General:</div>
                            <div style="line-height: 1.4; color: var(--text);">${procedimiento.join('<br>')}</div>
                        </div>

                        <div class="section-block">
                            <div class="section-title">🏋️ Ejercicios Adaptados para esta Fase (Presiona para simular):</div>
                            ${ejerciciosHTML}
                        </div>
                    </div>
                `;
            }

            const badgeHTML = currentPkg === 'premium' 
                ? `<span class="pkg-badge premium">PAQUETE PREMIUM ⭐ (Compresas + TENS/EMS + Terapia Manual)</span>`
                : `<span class="pkg-badge basic">PAQUETE BÁSICO (Compresas + Ejercicios Básicos)</span>`;

            document.getElementById('pkgBadgeContainer').innerHTML = badgeHTML;
            document.getElementById('outTotalSessions').innerText = `Total Recomendado: ${numSesiones} Sesiones`;
            document.getElementById('outFrequency').innerText = esEsclerosis ? `Frecuencia: 2 a 3 veces por semana (Controlando fatiga)` : `Frecuencia: 2 a 3 veces por semana`;
            document.getElementById('outSessionsList').innerHTML = listaSesionesHTML;

            const alertDiv = document.getElementById('outAlerts');
            alertDiv.innerHTML = alertas.length > 0 ? `<div class="alert-box"><ul>${alertas.map(a => `<li>${a}</li>`).join('')}</ul></div>` : "";

            document.getElementById('result-card').style.display = 'block';
            document.getElementById('result-card').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
